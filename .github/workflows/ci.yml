name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
      
      - name: Run Bandit SAST
        run: python -m bandit app.py

      - name: Build Docker image
        run: docker build -t devsecops-lab:ci .

      - name: Start Flask container
        run: |
          docker network create devsecops-net
          docker run -d --name devsecops-web --network devsecops-net -p 127.0.0.1:5000:5000 devsecops-lab:ci

