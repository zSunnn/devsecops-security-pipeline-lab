name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
      
      - name: Run Bandit SAST
        run: python -m bandit app.py

      - name: Build Docker image
        run: docker build -t devsecops-lab:ci .

      - name: Start Flask container
        run: |
          docker network create devsecops-net
          docker run -d --name devsecops-web --network devsecops-net -p 127.0.0.1:5000:5000 devsecops-lab:ci
      
      - name: Wait for Flask
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 3 http://127.0.0.1:5000/welcome; then
              exit 0
            fi
            sleep 2
          done
          docker logs devsecops-web
          exit 1
        
      - name: Prepare ZAP files
        run: |
          mkdir -p reports/raw
          cp .zap/baseline.conf reports/raw/baseline.conf
          chmod a+w reports/raw
        
      - name: Run ZAP Baseline
        run: |
          docker run --rm \
            --network devsecops-net \
            --mount "type=bind,source=$PWD/reports/raw,target=/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://devsecops-web:5000/welcome \
            -c baseline.conf \
            -I \
            -r zap-ci.html \
            -J zap-ci.json
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-reports
          path: |
            reports/raw/zap-ci.html
            reports/raw/zap-ci.json
          if-no-files-found: warn
          retention-days: 7
